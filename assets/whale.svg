      <path d="M135 103c3 7 5 11 2 13-3 2-7-1-7-5 0-3 3-5 5-8z" fill="#8ed2ff"/>
    </g>
  </g>

  <ellipse class="p-blush" cx="56" cy="114" rx="9.5" ry="4.6" fill="#ffb3c7" opacity=".9"/>
  <ellipse class="p-blush" cx="144" cy="114" rx="9.5" ry="4.6" fill="#ffb3c7" opacity=".9"/>

  <path class="m-smile" d="M92 114c3 6 13 6 16 0" fill="none" stroke="#17304b" stroke-width="2.8" stroke-linecap="round"/>
  <g class="m-open">
    <path d="M100 108c-11 2-16 11-14 18 2 8 9 12 14 12s12-4 14-12c2-7-3-16-14-18z" fill="#17304b"/>
    <ellipse cx="100" cy="130" rx="7.5" ry="4.2" fill="#ff8fa8"/>
